name: CI — TypeScript, tests et build

on:
  push:
    branches:
      - Main
      - main
      - master
      - fix/atelier-assistant-startup
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances et synchroniser le lockfile
        run: bun install

      - name: Vérification TypeScript
        run: bun run typecheck

      - name: Tests automatisés
        run: bun run test

      - name: Build de production
        run: bun run build
